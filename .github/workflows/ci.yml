name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (strict TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests (formula engine, 3-way merge, roll-up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  rules:
    name: Security rules (Firestore + Realtime DB emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:rules

  build:
    name: Production build + bundle budget
    runs-on: ubuntu-latest
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Bundle size report
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | size | gzip |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | $(gzip -c "$f" | wc -c | awk '{printf "%.0f KB", $1/1024}') |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Fail if the main bundle grows past 900 KB gzipped
        run: |
          total=$(cat dist/assets/*.js | gzip -c | wc -c)
          echo "total gzipped JS: $((total/1024)) KB"
          test "$total" -lt 921600

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm audit --omit=dev --audit-level=high
